preparingTitle:
  en[auto]: Preparing the agent's workplace
  pl: Przygotowuję miejsce pracy agenta
preparingBody:
  en[auto]: You don't need to do anything. The first time, I download the environment, which takes from a few seconds to a few minutes.
  pl: Nie musisz nic robić. Za pierwszym razem pobieram środowisko, to trwa od kilku sekund do kilku minut.
preparingHint:
  en[auto]: You can minimise the window — once everything is ready, I'll move on by myself.
  pl: Możesz zminimalizować okno — gdy wszystko będzie gotowe, sam przejdę dalej.
