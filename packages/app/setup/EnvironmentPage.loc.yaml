failedBody:
  en[auto]: It's not your fault — something didn't work on this computer or at this moment. Nothing on your computer has changed. Try again; if it happens again, restart your computer and try once more.
  pl: To nie Twój błąd — coś nie zadziałało na tym komputerze albo w tej chwili. Na Twoim komputerze nic się nie zmieniło. Spróbuj ponownie; jeśli to się powtórzy, uruchom komputer ponownie i spróbuj jeszcze raz.
