title:
  en[auto]: Couldn't check the connection to your AI
  pl: Nie udało się sprawdzić połączenia z AI
body:
  en[auto]: It's not your fault — the agent's workplace is ready, but I couldn't find out whether your AI account is connected to it. Try again; if it happens again, close the app and open it once more.
  pl: To nie Twój błąd — miejsce pracy agenta jest gotowe, ale nie udało mi się sprawdzić, czy jest połączone z Twoim kontem AI. Spróbuj ponownie; jeśli to się powtórzy, zamknij aplikację i otwórz ją jeszcze raz.
retry:
  en[auto]: Try again
  pl: Spróbuj ponownie
