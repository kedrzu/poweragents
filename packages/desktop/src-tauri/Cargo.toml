[package]
name = "poweragents"
version = "0.1.0"
description = "poweragents desktop app: the poweragents SPA in a native window"
edition = "2021"
publish = false

[lib]
name = "poweragents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6.0"
