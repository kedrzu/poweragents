name: Build

# The merge gate for pull requests. It runs the same build local setup does (`setup.build.sh`), then
# the checks of the `verify` skill's full protocol. For a stacked PR GitHub builds each node as the
# cumulative state of the chain up to it, so a green node means that slice compiles on its own.
#
# No secrets: the job runs on a plain runner, which is why `setup.build.sh` holds nothing that needs
# credentials or local infrastructure. The job name `Build` is the required check on the `main`
# ruleset — keep it stable.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # A hung step fails here with its log kept; without a limit it runs for GitHub's 6 hours, and a cancelled run
    # loses its log.
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The gitlink is the pin (nzyme/docs/consumers.md). nzyme is public, so the default token
          # clones it.
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # Follows package.json's `packageManager`, so the runner cannot drift from local.
          bun-version-file: package.json

      - name: Build
        run: bash setup.build.sh

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Tests
        run: bun run tests

  # The desktop shell's native side (packages/desktop/src-tauri). Its own job: it needs neither bun nor
  # nzyme, only Rust and the system libraries Tauri links on Linux. The job name `Desktop` is a required
  # check too.
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Tauri v2's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      # `tauri::generate_context!()` reads the app's build folder (`build.frontendDist`) at compile time;
      # the checks need only the folder, not the app in it.
      - name: The app's build folder
        run: mkdir -p ../../app/.output/public

      # `tauri-build` requires the daemon sidecar (`bundle.externalBin`) to exist; the checks only compile the shell,
      # so an empty file stands in for the binary `bun nx run @poweragents/daemon:sidecar` builds.
      - name: The daemon sidecar placeholder
        run: mkdir -p binaries && touch binaries/poweragents-daemon-x86_64-unknown-linux-gnu

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
